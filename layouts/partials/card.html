{{ $img := .Resources.GetMatch "cover.*" }}
<a class="card c-{{ partial "catslug.html" . }}{{ if $img }} has-image{{ end }}" href="{{ .RelPermalink }}">
  {{ with $img }}{{ $s := .Resize "640x webp" }}<img src="{{ $s.RelPermalink }}" alt="" loading="lazy" width="{{ $s.Width }}" height="{{ $s.Height }}">{{ end }}
  <p class="card-text">{{ .Content | plainify | htmlUnescape }}</p>
</a>
