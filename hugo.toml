baseURL = "https://deaete.jp/"
languageCode = "ja"
title = "出逢えてよかった"
defaultContentLanguage = "ja"
hasCJKLanguage = true
enableRobotsTXT = true
buildFuture = true

[params]
  author = "逢坂 透"
  description = "この星に降りて、出逢えてよかった人、光景、愛しい瞬間のことを、言の葉にして、のこしておきたい。"
  # X（旧Twitter）のユーザー名。@は不要。決まったら入れてください
  x = "deaeteyokatta3"
  # ことづてフォームの届け先（FormSubmit）。有効化メールが届いたあと、届いた英数字の別名に差し替えるとアドレスを隠せる
  formTo = "deaeteyokatta333@gmail.com"

  # 言の葉のカテゴリ（並び順＝表示順）。slugはページ内の目印に使う英字
  [[params.kotonohaCategories]]
    name = "愛しい人"
    slug = "itoshii-hito"
  [[params.kotonohaCategories]]
    name = "恋してる時"
    slug = "koishiteru"
  [[params.kotonohaCategories]]
    name = "偶然の出逢い"
    slug = "guuzen"
  [[params.kotonohaCategories]]
    name = "パパになって"
    slug = "papa"

[menus]
  [[menus.main]]
    name = "愛しい時間の言の葉"
    pageRef = "/kotonoha"
    weight = 10
  [[menus.main]]
    name = "出逢いの物語"
    pageRef = "/monogatari"
    weight = 20
  [[menus.main]]
    name = "ことづて"
    pageRef = "/kotozute"
    weight = 30

[markup.goldmark.renderer]
  hardWraps = true
  unsafe = true

[pagination]
  pagerSize = 24

[taxonomies]
  tag = "tags"
